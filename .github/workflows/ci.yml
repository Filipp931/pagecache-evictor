name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit + Linux integration tests, formatting
        run: ./gradlew build spotlessCheck

  native-image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      # GraalVM 25: FFM downcall support is on by default. Sets GRAALVM_HOME,
      # which the native plugin uses for native-image...
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # ...while the Gradle daemon itself runs on 21 (Gradle 8.14 does not run
      # on Java 25); setup-java last so it wins JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build native binary
        run: ./gradlew :cli:nativeCompile
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          BIN=cli/build/native/nativeCompile/pagecache
          "$BIN" --version | grep -E "pagecache [0-9]"
          dd if=/dev/urandom of=/tmp/demo.bin bs=1M count=16
          cat /tmp/demo.bin > /dev/null
          echo "--- stat on a warm file ---"
          "$BIN" stat /tmp/demo.bin | tee stat.out
          grep -Fq "demo.bin" stat.out
          grep -Eq "[0-9]+\.[0-9]+ MiB" stat.out
          echo "--- evict dry-run ---"
          mkdir -p /tmp/sweep && cp /tmp/demo.bin /tmp/sweep/old.rec
          touch -d "1 hour ago" /tmp/sweep/old.rec
          "$BIN" evict --dir /tmp/sweep --suffix .rec --keep-recent 120s --dry-run | tee evict.out
          grep -Fq "dry run" evict.out
          grep -Fq "would evict 1" evict.out
          echo "--- evict for real ---"
          "$BIN" evict --dir /tmp/sweep --suffix .rec --keep-recent 120s | tee evict2.out
          grep -Fq "evicted 1" evict2.out
      - uses: actions/upload-artifact@v4
        with:
          name: pagecache-linux-amd64
          path: cli/build/native/nativeCompile/pagecache
